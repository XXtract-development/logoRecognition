<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annotation Sufficiency Widget</title>
    <style>
        /* Widget Container - Designed to be embedded in existing interface */
        .sufficiency-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 320px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .sufficiency-widget.collapsed {
            width: 80px;
            height: 80px;
        }

        .widget-header {
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .widget-title {
            font-size: 0.9em;
            font-weight: 600;
        }

        .widget-toggle {
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .widget-toggle.collapsed {
            transform: rotate(180deg);
        }

        .widget-body {
            padding: 16px;
            max-height: 400px;
            overflow-y: auto;
        }

        .sufficiency-widget.collapsed .widget-body {
            display: none;
        }

        .sufficiency-widget.collapsed .widget-title {
            display: none;
        }

        /* Quick Status Indicator */
        .quick-status {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .status-circle {
            width: 60px;
            height: 60px;
            position: relative;
        }

        .status-circle svg {
            transform: rotate(-90deg);
        }

        .circle-bg {
            stroke: #e5e7eb;
            stroke-width: 6;
            fill: none;
        }

        .circle-progress {
            stroke-width: 6;
            fill: none;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }

        .status-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-info {
            flex: 1;
        }

        .status-label {
            font-size: 0.8em;
            color: #6b7280;
            margin-bottom: 2px;
        }

        .status-value {
            font-size: 1.1em;
            font-weight: 600;
            color: #1f2937;
        }

        .status-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: 600;
            display: inline-block;
            margin-top: 4px;
        }

        .badge-ready { background: #d1fae5; color: #065f46; }
        .badge-progress { background: #fed7aa; color: #92400e; }
        .badge-insufficient { background: #fee2e2; color: #991b1b; }

        /* Recommendations */
        .recommendations {
            background: #fef3c7;
            border-left: 3px solid #f59e0b;
            border-radius: 6px;
            padding: 10px;
            margin-top: 12px;
        }

        .recommendations-title {
            font-size: 0.85em;
            font-weight: 600;
            color: #92400e;
            margin-bottom: 6px;
        }

        .recommendation-item {
            font-size: 0.8em;
            color: #78350f;
            margin: 4px 0;
            padding-left: 12px;
            position: relative;
        }

        .recommendation-item:before {
            content: '•';
            position: absolute;
            left: 0;
        }

        /* Action Buttons */
        .widget-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .widget-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .widget-btn-primary {
            background: #7c3aed;
            color: white;
        }

        .widget-btn-primary:hover {
            background: #6d28d9;
        }

        .widget-btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .widget-btn-secondary:hover {
            background: #d1d5db;
        }

        /* Category/Value Selector */
        .selector-group {
            margin-bottom: 12px;
        }

        .selector-label {
            font-size: 0.8em;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .selector-input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.9em;
        }

        /* Floating Badge for Main Interface */
        .sufficiency-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s ease;
        }

        .sufficiency-badge:hover {
            transform: scale(1.1);
        }

        .badge-content {
            text-align: center;
        }

        .badge-percentage {
            font-size: 1.5em;
            font-weight: bold;
        }

        .badge-label {
            font-size: 0.7em;
            color: #6b7280;
        }

        /* Loading State */
        .loading-spinner {
            border: 2px solid #e5e7eb;
            border-top: 2px solid #7c3aed;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Integration Helper Styles */
        .sufficiency-inline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            background: #f9fafb;
            border-radius: 6px;
            font-size: 0.9em;
        }

        .sufficiency-inline .progress-mini {
            width: 24px;
            height: 24px;
            position: relative;
        }

        .sufficiency-inline .progress-mini svg {
            transform: rotate(-90deg);
        }

        .sufficiency-inline .status-text-mini {
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .sufficiency-widget {
                width: calc(100% - 40px);
                left: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Widget Version (kan overal toegevoegd worden) -->
    <div class="sufficiency-widget" id="sufficiency-widget">
        <div class="widget-header" onclick="toggleWidget()">
            <span class="widget-title">Training Readiness</span>
            <span class="widget-toggle" id="widget-toggle">⌄</span>
        </div>

        <div class="widget-body">
            <!-- Current Logo Selector -->
            <div class="selector-group">
                <div class="selector-label">Current Logo</div>
                <select class="selector-input" id="logo-selector" onchange="updateSufficiency()">
                    <option value="">Select logo...</option>
                    <option value="brand:nike">Nike</option>
                    <option value="brand:adidas">Adidas</option>
                    <option value="brand:apple">Apple</option>
                    <option value="type:logo">Logo Type</option>
                </select>
            </div>

            <!-- Quick Status -->
            <div class="quick-status">
                <div class="status-circle">
                    <svg width="60" height="60">
                        <circle cx="30" cy="30" r="27" class="circle-bg"></circle>
                        <circle cx="30" cy="30" r="27" class="circle-progress"
                                id="progress-circle"
                                style="stroke: #ef4444; stroke-dasharray: 170; stroke-dashoffset: 170;">
                        </circle>
                    </svg>
                    <div class="status-text" id="confidence-text">0%</div>
                </div>

                <div class="status-info">
                    <div class="status-label">Annotations</div>
                    <div class="status-value" id="annotation-count">0</div>
                    <span class="status-badge badge-insufficient" id="status-badge">Need Data</span>
                </div>
            </div>

            <!-- Recommendations -->
            <div class="recommendations" id="recommendations" style="display: none;">
                <div class="recommendations-title">Actions Needed</div>
                <div id="recommendation-list"></div>
            </div>

            <!-- Action Buttons -->
            <div class="widget-actions">
                <button class="widget-btn widget-btn-secondary" onclick="openDashboard()">
                    📊 Dashboard
                </button>
                <button class="widget-btn widget-btn-primary" id="train-btn" onclick="startTraining()" disabled>
                    🚀 Train
                </button>
            </div>
        </div>
    </div>

    <!-- Inline Badge Version (voor integratie in bestaande UI) -->
    <div class="sufficiency-inline" id="sufficiency-inline" style="display: none;">
        <div class="progress-mini">
            <svg width="24" height="24">
                <circle cx="12" cy="12" r="10" class="circle-bg" stroke-width="3"></circle>
                <circle cx="12" cy="12" r="10" class="circle-progress"
                        stroke-width="3"
                        style="stroke: #10b981; stroke-dasharray: 63; stroke-dashoffset: 16;">
                </circle>
            </svg>
        </div>
        <span class="status-text-mini">75% Ready</span>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'http://localhost:8000';
        let isCollapsed = false;
        let currentCategory = null;
        let currentValue = null;
        let autoRefreshInterval = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Auto-detect current annotation if integrated
            detectCurrentAnnotation();

            // Start auto-refresh
            autoRefreshInterval = setInterval(() => {
                if (currentCategory && currentValue) {
                    updateSufficiency(true); // silent update
                }
            }, 10000); // Every 10 seconds
        });

        // Toggle widget collapse
        function toggleWidget() {
            const widget = document.getElementById('sufficiency-widget');
            const toggle = document.getElementById('widget-toggle');

            isCollapsed = !isCollapsed;

            if (isCollapsed) {
                widget.classList.add('collapsed');
                toggle.classList.add('collapsed');
            } else {
                widget.classList.remove('collapsed');
                toggle.classList.remove('collapsed');
            }
        }

        // Update sufficiency data
        async function updateSufficiency(silent = false) {
            const selector = document.getElementById('logo-selector');
            const value = selector.value;

            if (!value) return;

            const [category, logoValue] = value.split(':');
            currentCategory = category;
            currentValue = logoValue;

            if (!silent) {
                document.getElementById('confidence-text').innerHTML = '<div class="loading-spinner"></div>';
            }

            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/annotation-metrics/sufficiency/${category}/${logoValue}?target_accuracy=95`
                );

                if (!response.ok) throw new Error('Failed to fetch data');

                const data = await response.json();
                const analysis = data.analysis;

                updateDisplay(analysis);
            } catch (error) {
                console.error('Error fetching sufficiency:', error);
                if (!silent) {
                    showError('Failed to load data');
                }
            }
        }

        // Update display with data
        function updateDisplay(analysis) {
            const confidence = Math.round(analysis.summary.current_confidence);
            const isReady = analysis.summary.is_sufficient;
            const needed = analysis.requirements.required_additional_annotations;

            // Update confidence circle
            const circle = document.getElementById('progress-circle');
            const circumference = 2 * Math.PI * 27;
            const offset = circumference - (confidence / 100 * circumference);

            circle.style.strokeDashoffset = offset;

            // Set color based on confidence
            let color, badgeClass, badgeText;
            if (confidence >= 95) {
                color = '#10b981';
                badgeClass = 'badge-ready';
                badgeText = '✅ Ready';
            } else if (confidence >= 70) {
                color = '#f59e0b';
                badgeClass = 'badge-progress';
                badgeText = '⚠️ Progress';
            } else {
                color = '#ef4444';
                badgeClass = 'badge-insufficient';
                badgeText = '❌ Need Data';
            }

            circle.style.stroke = color;

            // Update text
            document.getElementById('confidence-text').textContent = `${confidence}%`;
            document.getElementById('annotation-count').textContent =
                `${analysis.metrics.total_annotations} ${needed > 0 ? `(+${needed})` : ''}`;

            // Update badge
            const badge = document.getElementById('status-badge');
            badge.className = `status-badge ${badgeClass}`;
            badge.textContent = badgeText;

            // Update recommendations
            const recsContainer = document.getElementById('recommendations');
            const recsList = document.getElementById('recommendation-list');

            if (!isReady && analysis.requirements.recommendations.length > 0) {
                recsContainer.style.display = 'block';
                recsList.innerHTML = analysis.requirements.recommendations
                    .slice(0, 3)
                    .map(rec => {
                        const clean = rec.replace(/^[🔴🟡🟢💡✅]\s*/, '');
                        return `<div class="recommendation-item">${clean}</div>`;
                    })
                    .join('');
            } else {
                recsContainer.style.display = 'none';
            }

            // Update train button
            const trainBtn = document.getElementById('train-btn');
            trainBtn.disabled = !isReady;
            trainBtn.textContent = isReady ? '🚀 Train' : `⏳ Need ${needed} more`;
        }

        // Detect current annotation from page
        function detectCurrentAnnotation() {
            // Try to detect from existing form fields or URL
            // This would integrate with your existing annotation interface

            // Example: Check if there's a category select
            const existingCategory = document.querySelector('select[name="category"]');
            const existingValue = document.querySelector('input[name="logo_value"]');

            if (existingCategory && existingValue) {
                currentCategory = existingCategory.value;
                currentValue = existingValue.value;

                // Update selector
                const selector = document.getElementById('logo-selector');
                selector.value = `${currentCategory}:${currentValue}`;

                updateSufficiency();
            }
        }

        // Open full dashboard
        function openDashboard() {
            window.open('annotation_dashboard_production.html', '_blank');
        }

        // Start training
        function startTraining() {
            if (currentCategory && currentValue) {
                console.log(`Starting training for ${currentCategory}/${currentValue}`);
                // Call training API
                alert(`Training started for ${currentValue}!`);
            }
        }

        // Show error
        function showError(message) {
            document.getElementById('confidence-text').textContent = '!';
            document.getElementById('annotation-count').textContent = message;
        }

        // Public API for integration
        window.SufficiencyWidget = {
            update: function(category, value) {
                currentCategory = category;
                currentValue = value;
                const selector = document.getElementById('logo-selector');
                selector.value = `${category}:${value}`;
                updateSufficiency();
            },

            refresh: function() {
                updateSufficiency();
            },

            show: function() {
                document.getElementById('sufficiency-widget').style.display = 'block';
            },

            hide: function() {
                document.getElementById('sufficiency-widget').style.display = 'none';
            }
        };

        // Listen for custom events from main application
        window.addEventListener('annotationSaved', (e) => {
            if (e.detail && e.detail.category && e.detail.value) {
                SufficiencyWidget.update(e.detail.category, e.detail.value);
            }
        });
    </script>
</body>
</html>
