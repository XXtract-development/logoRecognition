[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# A++ Test execution configuration
addopts =
    -ra
    -q
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
    --cov-report=json
    --cov-fail-under=80
    --maxfail=100
    --tb=short
    --benchmark-autosave
    --benchmark-compare
    --hypothesis-show-statistics
    -p no:warnings

# Custom markers for A++ grade test organization
markers =
    unit: Unit tests - fast, isolated tests
    integration: Integration tests - test component interactions
    e2e: End-to-end tests - full workflow tests
    slow: Slow running tests (>1s execution time)
    asyncio: Asynchronous tests
    performance: Performance and benchmark tests
    security: Security-focused tests
    smoke: Quick smoke tests for basic functionality
    regression: Regression tests for bug fixes
    critical: Critical path tests that must pass
    flaky: Tests that may occasionally fail
    wip: Work in progress tests
    skip_ci: Tests to skip in CI/CD pipeline
    a_plus_plus: A++ grade comprehensive tests
    model_registry: Model registry tests
    versioning: Model versioning tests
    training: Training pipeline tests
    owasp: OWASP security tests
    auth: Authentication and authorization tests
    load: Load testing and stress tests
    penetration: Penetration testing and vulnerability scanning

# Coverage configuration
[coverage:run]
source = app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */migrations/*
    */config/*
    */venv/*
    */.venv/*
branch = True
parallel = True

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml