# Logo Recognition - Local Development Only
# This file is for LOCAL DEVELOPMENT. Do NOT use for Coolify deployments.
# For deployments use: docker-compose.acc.yml, docker-compose.prod.yml, docker-compose.test.yml

services:
  # Frontend - React + Vite
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: logo-recognition-web
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://api:8000
      - NODE_ENV=development
    depends_on:
      - api
    networks:
      - logo-recognition
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # API - Fastify
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: logo-recognition-api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=8000
      - HOST=0.0.0.0
    networks:
      - logo-recognition
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  logo-recognition:
    driver: bridge
