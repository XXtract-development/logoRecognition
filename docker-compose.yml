version: '3.8'

services:
  # Frontend - React + Vite
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: logo-recognition-web
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
    environment:
      - VITE_API_URL=http://api:8000
      - NODE_ENV=development
    depends_on:
      - api
    networks:
      - logo-recognition
    restart: unless-stopped

  # API - Fastify
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: logo-recognition-api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
    environment:
      - NODE_ENV=development
      - PORT=8000
      - HOST=0.0.0.0
    networks:
      - logo-recognition
    restart: unless-stopped

networks:
  logo-recognition:
    driver: bridge

volumes:
  node_modules_web:
  node_modules_api:
