version: '3.8'

# Full development environment for Logo Recognition System
# Usage: docker-compose -f docker-compose.full.yml up -d

services:
  # ============================================
  # FRONTEND - React + Vite
  # ============================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: logo-recognition-web
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages:/app/packages
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
      - NODE_ENV=development
    depends_on:
      - api
    networks:
      - logo-recognition
    restart: unless-stopped

  # ============================================
  # API GATEWAY - Fastify (Node.js)
  # ============================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: logo-recognition-api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    environment:
      - NODE_ENV=development
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/logo_recognition
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8001
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=logo-recognition
      - JWT_SECRET=dev-secret-change-in-production
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logo-recognition
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # ML SERVICE - FastAPI (Python)
  # ============================================
  ml-service:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile
    container_name: logo-recognition-ml
    ports:
      - "8001:8001"
    volumes:
      - ./apps/ml-service/app:/app/app
      - ml-models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8001
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/logo_recognition
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=logo-recognition
      - MODEL_PATH=/app/models
      - TORCH_HOME=/app/models/torch
      - CUDA_VISIBLE_DEVICES=  # Empty for CPU mode
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - logo-recognition
    restart: unless-stopped
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ============================================
  # DATABASE - PostgreSQL with pgvector
  # ============================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: logo-recognition-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=logo_recognition
    networks:
      - logo-recognition
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logo_recognition"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # CACHE - Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: logo-recognition-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./infrastructure/docker/redis/redis-master.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - logo-recognition
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # OBJECT STORAGE - MinIO (S3-compatible)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: logo-recognition-minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    command: server /data --console-address ":9001"
    networks:
      - logo-recognition
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO setup - creates default bucket
  minio-setup:
    image: minio/mc:latest
    container_name: logo-recognition-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/logo-recognition --ignore-existing;
      mc anonymous set download myminio/logo-recognition/public;
      mc mb myminio/models --ignore-existing;
      mc mb myminio/training-data --ignore-existing;
      echo 'MinIO buckets created successfully';
      exit 0;
      "
    networks:
      - logo-recognition

  # ============================================
  # MONITORING - Prometheus
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: logo-recognition-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - logo-recognition
    restart: unless-stopped

  # ============================================
  # VISUALIZATION - Grafana
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: logo-recognition-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - logo-recognition
    restart: unless-stopped

  # ============================================
  # LOG AGGREGATION - Loki
  # ============================================
  loki:
    image: grafana/loki:latest
    container_name: logo-recognition-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - logo-recognition
    restart: unless-stopped

  # ============================================
  # DATABASE ADMIN - pgAdmin (optional)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: logo-recognition-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@localhost.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      - postgres
    networks:
      - logo-recognition
    restart: unless-stopped
    profiles:
      - tools  # Only starts with: docker-compose --profile tools up

  # ============================================
  # REDIS UI - RedisInsight (optional)
  # ============================================
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: logo-recognition-redis-insight
    ports:
      - "8081:8001"
    depends_on:
      - redis
    networks:
      - logo-recognition
    restart: unless-stopped
    profiles:
      - tools

# ============================================
# NETWORKS
# ============================================
networks:
  logo-recognition:
    driver: bridge

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres-data:
  redis-data:
  minio-data:
  ml-models:
  prometheus-data:
  grafana-data:
  loki-data:
