<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Router Test</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/react-router-dom@6/dist/umd/react-router-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { BrowserRouter, Routes, Route, Link, useLocation } = window.ReactRouterDOM;
        
        function Home() {
            return <div><h1>Home Page ✅</h1><Link to="/test">Go to Test</Link></div>;
        }
        
        function Test() {
            return <div><h1>Test Page Works! ✅</h1><Link to="/">Go Home</Link></div>;
        }
        
        function Debug() {
            const location = useLocation();
            React.useEffect(() => {
                console.log('🔍 Current route:', location.pathname);
            }, [location]);
            return <div style={{background: '#f0f0f0', padding: '10px', margin: '10px'}}>
                Current route: <strong>{location.pathname}</strong>
            </div>;
        }
        
        function App() {
            return (
                <BrowserRouter>
                    <Debug />
                    <Routes>
                        <Route path="/" element={<Home />} />
                        <Route path="/test" element={<Test />} />
                    </Routes>
                </BrowserRouter>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
