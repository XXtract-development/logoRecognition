<!DOCTYPE html>
<html>
<head>
    <title>Upload Test - Direct</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .upload-area { border: 2px dashed #ccc; padding: 40px; text-align: center; margin: 20px 0; }
        .button { background: #1890ff; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .button:disabled { background: #ccc; cursor: not-allowed; }
        .success { background: #f6ffed; border: 1px solid #b7eb8f; padding: 16px; margin: 10px 0; border-radius: 6px; }
        .debug { background: #f5f5f5; padding: 12px; font-family: monospace; font-size: 12px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🧪 Direct Upload Test</h1>

    <div class="upload-area">
        <input type="file" id="fileInput" multiple accept="image/*">
        <p>Select image files to test upload</p>
    </div>

    <div id="debug" class="debug">
        Status: Ready<br>
        Uploaded files: 0<br>
        Backend: http://localhost:8000
    </div>

    <div id="results"></div>

    <button id="continueBtn" class="button" disabled>
        Continue to Annotation (0 files) ➡️
    </button>

    <script>
        let uploadedFiles = [];

        const fileInput = document.getElementById('fileInput');
        const debug = document.getElementById('debug');
        const results = document.getElementById('results');
        const continueBtn = document.getElementById('continueBtn');

        fileInput.addEventListener('change', async (event) => {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;

            debug.innerHTML = `Status: Uploading ${files.length} files...<br>Uploaded files: ${uploadedFiles.length}<br>Backend: http://localhost:8000`;

            for (let file of files) {
                try {
                    const formData = new FormData();
                    formData.append('file', file);

                    const response = await fetch('http://localhost:8000/api/v1/logos/upload', {
                        method: 'POST',
                        body: formData,
                    });

                    const data = await response.json();
                    console.log('Upload response:', data);

                    if (data.status === 'success' && data.results) {
                        uploadedFiles.push(...data.results);

                        const successDiv = document.createElement('div');
                        successDiv.className = 'success';
                        successDiv.innerHTML = `✅ ${file.name} uploaded successfully! (ID: ${data.results[0].file_id})`;
                        results.appendChild(successDiv);
                    } else {
                        throw new Error('Upload failed');
                    }
                } catch (error) {
                    console.error('Upload error:', error);
                    const errorDiv = document.createElement('div');
                    errorDiv.style.background = '#fff2f0';
                    errorDiv.style.border = '1px solid #ffccc7';
                    errorDiv.style.padding = '16px';
                    errorDiv.style.margin = '10px 0';
                    errorDiv.innerHTML = `❌ ${file.name} upload failed!`;
                    results.appendChild(errorDiv);
                }
            }

            debug.innerHTML = `Status: Upload complete<br>Uploaded files: ${uploadedFiles.length}<br>Backend: http://localhost:8000`;
            continueBtn.textContent = `Continue to Annotation (${uploadedFiles.length} files) ➡️`;
            continueBtn.disabled = uploadedFiles.length === 0;
        });

        continueBtn.addEventListener('click', () => {
            alert(`Success! Would proceed to annotation with ${uploadedFiles.length} files:\\n\\n${uploadedFiles.map(f => f.filename).join('\\n')}`);
            console.log('Files for annotation:', uploadedFiles);
        });
    </script>
</body>
</html>
