# Prometheus Configuration
# Logo Recognition System - Updated for Node.js/Python Architecture
# STORY-015: Observability Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'logo-recognition'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # ===========================================
  # APPLICATION SERVICES
  # ===========================================

  # Fastify API Gateway (Node.js)
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  # ML Service (Python/FastAPI)
  - job_name: 'ml-service'
    static_configs:
      - targets: ['ml-service:8001']
    metrics_path: /metrics
    scrape_interval: 10s

  # Frontend (Web Vitals - if exposed)
  - job_name: 'frontend'
    static_configs:
      - targets: ['web:3000']
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    # Only scrape if metrics endpoint exists
    honor_labels: true

  # ===========================================
  # DATA LAYER
  # ===========================================

  # PostgreSQL monitoring
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: /metrics

  # Redis monitoring
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: /metrics

  # MinIO monitoring
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
    scrape_interval: 30s

  # ===========================================
  # INFRASTRUCTURE
  # ===========================================

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    metrics_path: /metrics

  # Docker metrics (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics
    scrape_interval: 30s

  # ===========================================
  # BACKGROUND JOBS
  # ===========================================

  # BullMQ metrics (via bull-exporter if deployed)
  - job_name: 'bullmq'
    static_configs:
      - targets: ['bull-exporter:9538']
    metrics_path: /metrics
    scrape_interval: 30s
    # Only scrape if available
    honor_labels: true

