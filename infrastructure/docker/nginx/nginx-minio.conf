user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;

    # Buffer settings
    client_body_buffer_size 128k;
    client_max_body_size 10G;  # Support large file uploads
    client_body_timeout 300;
    client_header_timeout 300;

    # Proxy buffer settings
    proxy_buffering off;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
    proxy_max_temp_file_size 0;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
    gzip_types application/json application/javascript application/x-javascript text/css text/javascript text/plain text/xml;
    gzip_disable "msie6";

    # Cache settings
    proxy_cache_path /var/cache/nginx/minio levels=1:2 keys_zone=minio_cache:100m max_size=10g inactive=60m use_temp_path=off;

    # MinIO upstream servers with health checks
    upstream minio_servers {
        least_conn;

        # MinIO nodes
        server minio1:9000 max_fails=2 fail_timeout=30s;
        server minio2:9000 max_fails=2 fail_timeout=30s;
        server minio3:9000 max_fails=2 fail_timeout=30s;
        server minio4:9000 max_fails=2 fail_timeout=30s;

        # Keepalive connections
        keepalive 32;
    }

    # MinIO Console upstream servers
    upstream minio_console {
        least_conn;

        server minio1:9001 max_fails=2 fail_timeout=30s;
        server minio2:9001 max_fails=2 fail_timeout=30s;
        server minio3:9001 max_fails=2 fail_timeout=30s;
        server minio4:9001 max_fails=2 fail_timeout=30s;

        keepalive 16;
    }

    # MinIO API Server
    server {
        listen 9000;
        server_name _;

        # Allow special characters in headers
        ignore_invalid_headers off;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # CORS headers for S3 API
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Amz-Date, X-Amz-Content-Sha256, X-Requested-With" always;
        add_header Access-Control-Expose-Headers "ETag, X-Amz-Request-Id" always;
        add_header Access-Control-Max-Age "3600" always;

        # Handle OPTIONS requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        location / {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;

            # Connection settings
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;

            # Disable buffering for uploads
            proxy_request_buffering off;

            # Pass to MinIO
            proxy_pass http://minio_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Cache GET requests for public buckets
            proxy_cache minio_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 302 1h;
            proxy_cache_valid 404 1m;
            proxy_cache_bypass $http_authorization;
            proxy_no_cache $http_authorization;

            # Add cache status header
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Health check endpoint
        location /minio/health {
            proxy_pass http://minio_servers;
            proxy_set_header Host $http_host;
            access_log off;
        }
    }

    # MinIO Console Server
    server {
        listen 9001;
        server_name _;

        # Allow special characters in headers
        ignore_invalid_headers off;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;

            # WebSocket support for console
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Connection settings
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;

            # Pass to MinIO Console
            proxy_pass http://minio_console;
            proxy_http_version 1.1;
        }

        # WebSocket endpoint
        location /ws {
            proxy_pass http://minio_console;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}