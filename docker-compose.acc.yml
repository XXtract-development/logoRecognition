# ACC Environment - Self-contained for Coolify deployment
# Server: Vanilla-ACC (10.0.0.5)
# Database: PostgreSQL on Cherry (10.0.0.6:5432)
# Storage: MinIO with Storage Box mount for persistence

# DEPLOY NOTE: After merge, confirm Redis service is running before API container
# starts BullMQ connections: redis-cli -u $REDIS_URL ping (expected: PONG)
# redis-data volume holds only BullMQ queue state — no backup obligation.
# PIPELINE_SERVICE_KEY must be set as a Coolify secret env var (min 32 chars random string).

services:
  # Redis — BullMQ queue backend (Epic 9, Story 9.1)
  redis:
    image: redis:7-alpine
    network_mode: host
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    network_mode: host
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - /mnt/storagebox-home/acc/logo-recognition/minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: logo-recognition-app:acc
    network_mode: host
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - ENVIRONMENT=acc
      - PORT=8010
      - ML_SERVICE_URL=http://localhost:8011
      # Single source of truth for the holdout guard on BOTH layers (API + ML)
      - HOLDOUT_MINIMUM=${HOLDOUT_MINIMUM:-25}
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:${APP_PORT:-8010}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.logo-acc.rule=Host(`logo-detection.acc.xxtract.com`)"
      - "traefik.http.routers.logo-acc.entryPoints=https"
      - "traefik.http.routers.logo-acc.tls.certresolver=letsencrypt"
      - "traefik.http.routers.logo-acc.tls=true"
      - "traefik.http.services.logo-acc.loadbalancer.server.port=8010"
      - "traefik.http.routers.logo-acc-http.rule=Host(`logo-detection.acc.xxtract.com`)"
      - "traefik.http.routers.logo-acc-http.entryPoints=http"
      - "traefik.http.routers.logo-acc-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  ml-service:
    build:
      context: .
      dockerfile: apps/ml-service/Dockerfile
    image: logo-recognition-ml:acc
    network_mode: host
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - ENVIRONMENT=acc
      - PORT=8011
      # Same value as the app service — one env var, two guards (NFR3)
      - HOLDOUT_MINIMUM=${HOLDOUT_MINIMUM:-25}
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:${ML_PORT:-8011}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G

volumes:
  # BullMQ queue state — survives Redis restarts (crash-resilience NFR1).
  # Not primary data; no backup obligation. Can be safely deleted to clear all
  # pending/failed jobs (manual recovery action).
  redis-data:
