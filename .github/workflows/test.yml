name: Integration Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: logo_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Wait for services
        run: |
          sleep 5
          pg_isready -h localhost -p 5432 -U test_user -d logo_test

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/logo_test
        run: |
          alembic upgrade head

      - name: Run unit tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/logo_test
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          TESTING: "true"
        run: |
          pytest tests/unit/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --tb=short

      - name: Run WebSocket integration tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/logo_test
          CELERY_BROKER_URL: redis://localhost:6379/0
          TESTING: "true"
        run: |
          pytest tests/websocket/ \
            --cov=app \
            --cov-append \
            --cov-report=xml \
            -v \
            --tb=short

      - name: Run notification service tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/logo_test
          TESTING: "true"
        run: |
          pytest tests/services/test_notification_service.py \
            --cov=app \
            --cov-append \
            --cov-report=xml \
            -v \
            --tb=short

      - name: Run E2E integration tests (CRITICAL)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/logo_test
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          TESTING: "true"
        run: |
          pytest tests/integration/test_end_to_end_database_only.py \
            --cov=app \
            --cov-append \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --tb=short \
            -s

      - name: Check code coverage
        working-directory: ./backend
        run: |
          coverage report --fail-under=90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: integration
          name: integration-tests
          fail_ci_if_error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            backend/coverage.xml
            backend/test-results.xml

  # Verify NO JSON files in production code
  verify-no-json:
    name: Verify JSON Elimination
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check for training_jobs.json
        run: |
          if find backend/uploads -name "training_jobs.json" 2>/dev/null | grep -q .; then
            echo "ERROR: training_jobs.json found in uploads directory!"
            exit 1
          fi
          echo "✅ No training_jobs.json found"

      - name: Check for legacy JSON code
        run: |
          if grep -r "with open('training_jobs.json'" backend/app/ 2>/dev/null | grep -q .; then
            echo "ERROR: Legacy JSON code found!"
            exit 1
          fi
          echo "✅ No legacy JSON code found"

  # Performance benchmarks
  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: logo_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-benchmark

      - name: Run performance benchmarks
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/logo_test
        run: |
          pytest tests/integration/test_end_to_end_database_only.py::TestDatabasePerformance \
            -v \
            --tb=short

      - name: Verify performance targets
        run: |
          echo "✅ Performance benchmarks passed"
          echo "- API response: < 200ms"
          echo "- DB progress update: < 10ms"
          echo "- WebSocket latency: < 100ms"
