name: CI/CD Pipeline

on:
  push:
    branches: [main, acc, develop, refactor]
  pull_request:
    branches: [main, acc, develop]

env:
  NODE_VERSION: '22.x'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '9'

jobs:
  # ===========================================
  # FRONTEND & API GATEWAY (Node.js)
  # ===========================================
  test-node:
    name: Test Node.js Apps
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logo_recognition_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: |
          cd apps/api
          npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logo_recognition_test

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm type-check

      - name: Run unit tests (Frontend)
        run: pnpm --filter @logo-recognition/web test:coverage

      - name: Run unit tests (API)
        run: pnpm --filter @logo-recognition/api test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logo_recognition_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
          NODE_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/web/coverage/lcov.info,./apps/api/coverage/lcov.info
          flags: node
          fail_ci_if_error: false

  # ===========================================
  # PIPELINE SMOKE TEST (Epic 9, Story 9.6)
  # Runs on push to main/acc only — not on every PR.
  # Exercises the full pipeline flow on a mini-dataset:
  #   incorporate → batch (incl. synthetic fill) → train (2-3 epochs)
  #   → holdout evaluation → gate with configurable threshold (AC4: GATE_MIN_IMPROVEMENT=0.02)
  # Failure blocks the build (continue-on-error: false).
  # ===========================================
  smoke-test-pipeline:
    name: Pipeline Smoke Test (Epic 9)
    runs-on: ubuntu-latest
    needs: [test-node]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/acc')
    timeout-minutes: 10

    env:
      NODE_ENV: test
      JWT_SECRET: smoke-test-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logo_recognition_test
      REDIS_URL: redis://localhost:6379
      PIPELINE_SERVICE_KEY: smoke-test-pipeline-key-32chars-min
      GATE_MIN_IMPROVEMENT: '0.02'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logo_recognition_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: |
          cd apps/api
          npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logo_recognition_test

      - name: Run pipeline smoke tests
        run: pnpm --filter @logo-recognition/api vitest run src/__tests__/smoke/pipeline-smoke-test.test.ts --reporter=verbose
        timeout-minutes: 8
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logo_recognition_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: smoke-test-secret
          PIPELINE_SERVICE_KEY: smoke-test-pipeline-key-32chars-min
          GATE_MIN_IMPROVEMENT: '0.02'
          MINI_DATASET_PATH: tests/fixtures/mini-dataset

  # ===========================================
  # ML SERVICE (Python)
  # ===========================================
  test-ml-service:
    name: Test ML Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logo_recognition_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: apps/ml-service/requirements.txt

      - name: Install dependencies
        run: |
          cd apps/ml-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: |
          cd apps/ml-service
          pip install ruff black isort mypy
          ruff check app/
          black --check app/
          isort --check-only app/

      - name: Run type checking
        run: |
          cd apps/ml-service
          mypy app/ --ignore-missing-imports || true

      - name: Run tests
        run: |
          cd apps/ml-service
          pytest tests/ -v --cov=app --cov-report=xml || echo "No tests yet"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logo_recognition_test
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: apps/ml-service/coverage.xml
          flags: python
          fail_ci_if_error: false

  # ===========================================
  # E2E TESTS
  # ===========================================
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-node]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build frontend
        run: pnpm --filter @logo-recognition/web build

      - name: Run E2E tests
        run: pnpm --filter @logo-recognition/web test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ===========================================
  # BUILD DOCKER IMAGES
  # ===========================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-node, test-ml-service]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile.dev
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
          - name: ml-service
            context: apps/ml-service
            dockerfile: apps/ml-service/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # SECURITY SCANNING
  # ===========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [test-node, test-ml-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level=high || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Python security scan
        run: |
          pip install safety bandit
          cd apps/ml-service
          safety check -r requirements.txt || true
          bandit -r app/ -ll || true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ===========================================
  # DEPLOY TO STAGING
  # ===========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-images, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # e.g., kubectl apply, docker-compose pull, etc.

  # ===========================================
  # DEPLOY TO PRODUCTION
  # ===========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images, security-scan, test-e2e]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here

      - name: Notify on success
        if: success()
        run: |
          echo "Deployment successful!"
          # Add notification (Slack, Discord, etc.)

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed!"
          # Add failure notification
