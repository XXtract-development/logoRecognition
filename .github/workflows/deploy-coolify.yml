name: Deploy to Coolify

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.13'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run frontend tests
        run: |
          cd frontend
          pnpm test

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests/ -v

      - name: Run linting
        run: |
          cd frontend
          pnpm lint
          cd ../backend
          flake8 . --max-line-length=88 --extend-ignore=E203,W503

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install

      - name: Build frontend
        run: |
          cd frontend
          pnpm build:web

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 1

  deploy-frontend:
    name: Deploy Frontend to Coolify
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Coolify
        run: |
          curl -X POST "${{ secrets.COOLIFY_FRONTEND_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "ref": "main",
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "repository": "${{ github.repository }}"
            }'

      - name: Wait for deployment
        run: |
          echo "Waiting for frontend deployment to complete..."
          sleep 30

      - name: Verify deployment
        run: |
          curl -f https://logo-app.yourdomain.com || exit 1
          echo "Frontend deployment verified!"

  deploy-backend:
    name: Deploy Backend to Coolify
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Coolify
        run: |
          curl -X POST "${{ secrets.COOLIFY_BACKEND_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "ref": "main",
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "repository": "${{ github.repository }}"
            }'

      - name: Wait for deployment
        run: |
          echo "Waiting for backend deployment to complete..."
          sleep 60

      - name: Verify deployment
        run: |
          curl -f https://api.logo-app.yourdomain.com/health || exit 1
          echo "Backend deployment verified!"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/staging'

    steps:
      - name: Deploy frontend to staging
        run: |
          curl -X POST "${{ secrets.COOLIFY_STAGING_FRONTEND_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "ref": "staging",
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "repository": "${{ github.repository }}"
            }'

      - name: Deploy backend to staging
        run: |
          curl -X POST "${{ secrets.COOLIFY_STAGING_BACKEND_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "ref": "staging",
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "repository": "${{ github.repository }}"
            }'

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Notify success
        if: needs.deploy-frontend.result == 'success' && needs.deploy-backend.result == 'success'
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "✅ Logo Recognition System deployed successfully to production!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Complete* ✅\n\nLogo Recognition System has been successfully deployed to production.\n\n*Links:*\n• Frontend: https://logo-app.yourdomain.com\n• API: https://api.logo-app.yourdomain.com\n• Monitoring: https://monitoring.logo-app.yourdomain.com\n\n*Commit:* `${{ github.sha }}`"
                  }
                }
              ]
            }'

      - name: Notify failure
        if: needs.deploy-frontend.result == 'failure' || needs.deploy-backend.result == 'failure'
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "❌ Logo Recognition System deployment failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Failed* ❌\n\nLogo Recognition System deployment to production has failed.\n\n*Check the logs:*\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n*Commit:* `${{ github.sha }}`"
                  }
                }
              ]
            }'