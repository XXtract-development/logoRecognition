name: Build and Push Docker Images

on:
  push:
    branches: [acc, main]
  workflow_dispatch:

# CI-1: workflow-level concurrency (covers the deploy job too) — a newer push
# cancels the whole older run so a stale deploy can never fire after a newer one.
concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: xxtract-development/logo-recognition

jobs:
  build-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CI-1: OCI labels (org.opencontainers.image.revision et al.) so the host
      # can prove image == commit via docker inspect (AC1).
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-app:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-app:${{ github.sha }}

  build-ml:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ML service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/ml-service/Dockerfile
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ml
          cache-to: type=gha,scope=ml,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ml:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ml:${{ github.sha }}

  # CI-1: acc-only deploy trigger. Runs ONLY when both images are pushed
  # (needs:). GitHub runners cannot reach the Coolify API (firewall-2), so the
  # job only moves branch acc-deploy to this commit; Coolify follows that branch
  # and deploys it on the GitHub push webhook, and docker-compose.acc.yml picks
  # both images by SOURCE_COMMIT (the commit Coolify checked out).
  deploy-acc:
    if: github.ref == 'refs/heads/acc' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build-app, build-ml]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Move acc-deploy to this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        run: bash .github/scripts/move-acc-deploy-branch.sh
