# Quality Gate Decision - US-INT-001: JSON to PostgreSQL Schema Migration

schema: 1
story: "US-INT-001"
story_title: "JSON to PostgreSQL Schema Migration"
gate: "FAIL"
status_reason: "Critical schema mismatch between model and migration. Migration missing 9 required fields causing runtime failures. Tests cannot execute due to environment issues."
reviewer: "Quinn (Test Architect)"
updated: "2025-10-03T00:00:00Z"

waiver:
  active: false

# Critical Issues Requiring Immediate Fix
top_issues:
  - id: "SCHEMA-001"
    severity: high
    finding: "Migration schema incomplete - missing 9 critical fields from AC2 requirements"
    details: |
      Migration file (b8d46cdab736) is missing these required fields that exist in model:
      - dataset_version_id (UUID, indexed, required for US-INT-003)
      - augmentation_factor (Integer, training config)
      - target_categories (JSONB, training targets)
      - accuracy_threshold (Float, quality control)
      - eta_seconds (Integer, progress tracking)
      - checksum (String(64), duplicate detection)
      - created_by (String(255), indexed, user tracking)
      - version (Integer, optimistic locking)
      - batch_size (Integer, training parameter)
    suggested_action: "Generate new migration with --autogenerate to capture all model fields, or manually add missing columns"
    refs:
      - "backend/alembic/versions/b8d46cdab736_us_int_001_add_training_jobs_and_model_.py:38-58"
      - "backend/app/models/training.py:32-63"

  - id: "TEST-001"
    severity: high
    finding: "All tests failing - cannot verify rollback requirements (AC7)"
    details: |
      Test execution failed with:
      - ModuleNotFoundError: No module named 'fakeredis' (despite being in requirements.txt)
      - Coverage failure: 0% < 80% required
      - Cannot verify < 5 second rollback requirement
      - Cannot verify idempotency
      - Cannot verify CASCADE delete behavior
    suggested_action: "Install dependencies with 'pip install -r requirements.txt' and re-run tests"
    refs:
      - "backend/tests/test_migration_rollback.py"
      - "backend/tests/conftest.py:133"

  - id: "STORY-001"
    severity: high
    finding: "Story file missing required Dev Agent sections - cannot track implementation"
    details: |
      Story file lacks critical tracking sections:
      - No "Status" field (should be "Ready for Review")
      - No "Dev Agent Record" section with task checkboxes
      - No "File List" section documenting changed files
      - Cannot verify which ACs were actually implemented
    suggested_action: "Dev agent must update story file with standard sections before QA review"
    refs:
      - "docs/sprints/sprint-integration-training/US-INT-001-database-migration.md"

  - id: "SCOPE-001"
    severity: medium
    finding: "Migration scope creep - combines US-INT-001 with category tables from different story"
    details: |
      Migration b8d46cdab736 creates 3 tables:
      1. categories (NOT part of US-INT-001)
      2. training_jobs (US-INT-001 ✓)
      3. model_registry (US-INT-001 ✓)

      Categories table appears to be from a different story, violating single responsibility.
    suggested_action: "Split into separate migrations: one for categories, one for US-INT-001 tables"
    refs:
      - "backend/alembic/versions/b8d46cdab736_us_int_001_add_training_jobs_and_model_.py:20-36"

